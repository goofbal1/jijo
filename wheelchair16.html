<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autonomous – Single-Tread Wheelchair</title>
<style>
:root{--bg:#eef1f5;--fg:#1c2430;--card:#ffffffd9;--ac:#e8590c;--bd:#c9d1dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--fg:#e6ebf2;--card:#1e2733d9;--bd:#344154}}
:root[data-theme="dark"]{--bg:#141a22;--fg:#e6ebf2;--card:#1e2733d9;--bd:#344154}
html,body{height:100%;margin:0}
body{background:linear-gradient(#2f64b0 0%,#7fb0e0 40%,#cfe3f2 55%,#cfe3f2 100%);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{position:absolute;left:12px;right:12px;bottom:12px;max-width:520px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px)}
.title{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;pointer-events:none}
.title b{font-size:18px}.title span{display:block;opacity:.7;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row label{min-width:104px}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button.alt.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--ac)}
#joke{position:absolute;inset:0;display:none;align-items:center;justify-content:center;opacity:.5;pointer-events:none}
#joke.on{display:flex}
#joke img{height:min(75vh,110vw);width:auto;image-rendering:auto}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.fog=new THREE.Fog(0xcfe3f2,14,70);
const cam=new THREE.PerspectiveCamera(45,1,0.1,100);
S.add(new THREE.HemisphereLight(0xffffff,0x556070,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(3,6,4);S.add(sun);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.2},o));
const frameM=M(0x23262b,{metalness:.6}),seatM=M(0x4a4f57),treadM=M(0x14181d,{roughness:.9}),cleatM=M(0x30343a,{roughness:.8}),accM=M(0x8a9099),em=M(0x3a3d42,{metalness:.7,roughness:.4});
const heatM=M(0xff5a1f,{emissive:0xff3b00,emissiveIntensity:0});
const screenM=M(0x2aa6ff,{emissive:0x2aa6ff,emissiveIntensity:.8});
const flameM=new THREE.MeshBasicMaterial({color:0xdcefff,transparent:true,opacity:.55});

// terrain
const terrain=new THREE.Group();S.add(terrain);
const ground=new THREE.Mesh(new THREE.CircleGeometry(80,48),M(0x8c9094,{roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.002;S.add(ground);
const SPAN=8;
for(let i=0;i<22;i++){
  const s=.15+Math.random()*.3;
  const g=new THREE.Group();
  let x=(Math.random()-.5)*SPAN,z=(Math.random()-.5)*SPAN;
  if(Math.hypot(x,z)<1.1)x+=1.6;
  g.position.set(x,0,z);g.scale.set(1,1,.7+Math.random()*.5);g.rotation.y=Math.random()*3;
  [[s*1.25,0x5a4531,.004,.9],[s,0x3d2c1e,.007,.7],[s*.65,0x281c13,.01,.25]].forEach(d=>{
    const m=new THREE.Mesh(new THREE.CircleGeometry(d[0],28),M(d[1],{roughness:d[3],metalness:0}));
    m.rotation.x=-Math.PI/2;m.position.y=d[2];g.add(m);
  });
  terrain.add(g);
}
const grid=new THREE.GridHelper(64,64,0x666a70,0x666a70);grid.material.opacity=.35;grid.material.transparent=true;terrain.add(grid);

const tread=new THREE.Group(),chair=new THREE.Group();S.add(tread);S.add(chair);
const box=(w,h,d,m,x,y,z,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(p||chair).add(o);return o};
const cyl=(rt,rb,h,m,x,y,z,p)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20),m);o.position.set(x,y,z);(p||chair).add(o);return o};

// ONE big tread
const L=.7,r=.12,W=.58,P=2*L+2*Math.PI*r,N=44,cl=[];
tread.position.y=r+.01;
const sh=new THREE.Shape();
sh.moveTo(-L/2,r*.92);sh.lineTo(L/2,r*.92);sh.absarc(L/2,0,r*.92,Math.PI/2,-Math.PI/2,true);
sh.lineTo(-L/2,-r*.92);sh.absarc(-L/2,0,r*.92,-Math.PI/2,-3*Math.PI/2,true);
const geo=new THREE.ExtrudeGeometry(sh,{depth:W,bevelEnabled:false,curveSegments:16});geo.translate(0,0,-W/2);
tread.add(new THREE.Mesh(geo,treadM));
[-1,1].forEach(s=>{const w=cyl(r*.7,r*.7,W+.02,frameM,s*L/2,0,0,tread);w.rotation.x=Math.PI/2});
for(let i=0;i<N;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(.03,.026,W+.01),cleatM);tread.add(c);cl.push(c)}
cyl(.16,.16,.03,accM,0,.13,0,tread); // slewing ring
function pt(s,o){s=((s%P)+P)%P;let x,y,a;
  if(s<L){x=-L/2+s;y=r;a=Math.PI/2}
  else if((s-=L)<Math.PI*r){a=Math.PI/2-s/r;x=L/2+r*Math.cos(a);y=r*Math.sin(a)}
  else if((s-=Math.PI*r)<L){x=L/2-s;y=-r;a=-Math.PI/2}
  else{s-=L;a=-Math.PI/2-s/r;x=-L/2+r*Math.cos(a);y=r*Math.sin(a)}
  o.position.set(x+Math.cos(a)*.008,y+Math.sin(a)*.008,0);o.rotation.z=a-Math.PI/2}

// chair (rotates independently of the tread)
box(.56,.05,.64,frameM,0,.46,0);
box(.46,.09,.5,seatM,0,.53,.02);
box(.46,.58,.07,seatM,0,.86,-.26).rotation.x=-.1;
[-1,1].forEach(s=>{
  box(.04,.04,.42,frameM,s*.26,.78,-.02);
  box(.04,.26,.04,frameM,s*.26,.64,.15);
  box(.04,.04,.04,accM,s*.26,.78,.19);
  box(.035,.4,.035,frameM,s*.23,1.05,-.3);
  box(.035,.035,.14,accM,s*.23,1.26,-.35);
});
// engine on the swivel ring
const engine=new THREE.Group();engine.position.set(0,.35,0);chair.add(engine);
box(.28,.14,.28,em,0,0,0,engine);
[-1,1].forEach(s=>box(.08,.05,.22,accM,s*.08,.09,0,engine));
for(let k=-2;k<=2;k++)box(.3,.012,.035,em,0,0,k*.05,engine);
cyl(.025,.025,.2,em,0,.36,-.25).rotation.x=Math.PI/2;
// heat pads
box(.36,.012,.38,heatM,0,.583,.04);
box(.38,.03,.2,frameM,0,.3,.62);box(.34,.012,.16,heatM,0,.322,.62);
// massage nodes: back + calves
const nodes=[];
const node=(p,x,y,z,row)=>{const n=new THREE.Mesh(new THREE.SphereGeometry(.028,12,12),heatM);n.position.set(x,y,z);n.userData={z:z,row:row};p.add(n);nodes.push(n)};
[-1,1].forEach(s=>{for(let k=0;k<4;k++)node(chair,s*.08,.68+k*.11,-.215,k)});
[-1,1].forEach(s=>{
  const g=new THREE.Group();g.position.set(s*.12,.42,.38);g.rotation.x=-.25;chair.add(g);
  box(.15,.26,.06,seatM,0,0,0,g);
  for(let k=0;k<3;k++)node(g,0,-.08+k*.08,.035,k);
  box(.03,.04,.1,frameM,s*.12,.44,.33);
  box(.03,.03,.24,frameM,s*.12,.3,.5);
});
// joystick (left = +x) and control panel (right = -x)
cyl(.025,.03,.02,frameM,.26,.805,.08);cyl(.008,.008,.07,frameM,.26,.845,.08);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.022,14,14),accM);ball.position.set(.26,.89,.08);chair.add(ball);
const pan=new THREE.Group();pan.position.set(-.26,.815,.08);pan.rotation.x=-.3;chair.add(pan);
box(.1,.012,.13,frameM,0,0,0,pan);box(.085,.004,.11,screenM,0,.008,0,pan);
// umbrella holder + umbrella
cyl(.022,.022,.3,frameM,.26,.66,-.31);
const umbrella=new THREE.Group();umbrella.visible=false;chair.add(umbrella);
cyl(.01,.01,1.3,frameM,.26,1.3,-.31,umbrella);
const cone=new THREE.Mesh(new THREE.ConeGeometry(.7,.22,28,1,true),new THREE.MeshStandardMaterial({color:0x2c2f34,side:THREE.DoubleSide,roughness:.8}));cone.position.set(.26,2.0,-.31);umbrella.add(cone);
// compressed-air jets on the sides
const flames=[];
const fg=new THREE.ConeGeometry(.025,.16,12);fg.rotateZ(-Math.PI/2);fg.translate(.08,0,0);
[[1,.06],[1,-.1],[-1,.06],[-1,-.1]].forEach(p=>{
  const n=cyl(.022,.04,.09,frameM,p[0]*.27,.53,p[1]);n.rotation.z=-p[0]*Math.PI/2;
  const f=new THREE.Mesh(fg,flameM);f.position.set(p[0]*.315,.53,p[1]);if(p[0]<0)f.rotation.y=Math.PI;f.visible=false;chair.add(f);flames.push(f);
});

// state + UI
let heading=0,target=0,cyaw=0,driving=false,comfort=true,thrust=false,phase=0;
const keys={},wrap=x=>((x+SPAN)%(SPAN*2)+SPAN*2)%(SPAN*2)-SPAN;
addEventListener('keydown',e=>{
  if(/^(Arrow|Key[WASD])/.test(e.code))e.preventDefault();
  if(!e.repeat){if(e.code==='KeyH')comfort=!comfort;if(e.code==='KeyB')document.getElementById('joke').classList.toggle('on');if(e.code==='KeyU')umbrella.visible=!umbrella.visible}
  keys[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

// orbit
let az=.7,el=.45,dist=3.6;const home=[az,el,dist];
const ptrs=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);if(ptrs.size==2){const[a,b]=[...ptrs.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId);
  if(ptrs.size==1){az-=(e.clientX-o.clientX)*.007;el=Math.max(.05,Math.min(1.45,el+(e.clientY-o.clientY)*.007))}
  ptrs.set(e.pointerId,e);
  if(ptrs.size==2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);dist=Math.max(1.8,Math.min(8,dist*pd/d));pd=d}
});
const up=e=>ptrs.delete(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(1.8,Math.min(8,dist*(1+e.deltaY*.001)))},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(t){
  const dt=Math.min((t-last)/1000,.05);last=t;const tt=t/1000;
  const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),rt=(keys.KeyD?1:0)-(keys.KeyA?1:0),turn=(keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0);
  cyaw+=turn*1.8*dt;
  if(f||rt){const dx=-f*Math.sin(az)+rt*Math.cos(az),dz=-f*Math.cos(az)-rt*Math.sin(az);target=Math.atan2(-dz,dx)}
  let df=target-heading;df=Math.atan2(Math.sin(df),Math.cos(df));
  heading+=df*Math.min(1,dt*7);
  tread.rotation.y=heading;chair.rotation.y=cyaw;
  driving=!!(f||rt);thrust=!!(turn||rt);
  if(driving){
    const v=.9*Math.max(0,Math.cos(df));phase+=v*dt;
    terrain.position.x=wrap(terrain.position.x-Math.cos(heading)*v*dt);
    terrain.position.z=wrap(terrain.position.z+Math.sin(heading)*v*dt);
  }
  cl.forEach((c,i)=>pt(phase+i*P/N,c));
  if(comfort){heatM.emissiveIntensity=.55+.2*Math.sin(tt*2);nodes.forEach(n=>{n.position.z=n.userData.z+Math.max(0,Math.sin(tt*5-n.userData.row*1.1))*.02})}
  else{heatM.emissiveIntensity=0;nodes.forEach(n=>{n.position.z=n.userData.z})}
  flames.forEach((f,i)=>{const b=Math.max(0,Math.sin(tt*6+i*1.7));f.visible=thrust&&b>.15;if(f.visible)f.scale.set(.3+b,.6+.6*b,.6+.6*b)});
  engine.position.y=.35+(driving?Math.sin(t*.09)*.0015:0);
  cam.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+.5,Math.cos(az)*Math.cos(el)*dist);
  cam.lookAt(0,.55,0);
  R.render(S,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
